##
# uWSGI configuration for udata frontend
##

[uwsgi]


master= true

; For debugging purposes inside the container
touch-reload = /tmp/uwsgi-reload

; Python / Environment configuration
module = udata.wsgi
callable = app
env = UDATA_SETTINGS=/srv/udata/udata.cfg
check-static = /srv/public
; static-map = /s=/srv/fs // These are not static files, but the data files. We use S3 instead, and did not configure the /s either.
offload-threads = 4

http = 0.0.0.0:7000
stats = 0.0.0.0:7001

; gevent = 30 ; using enable-threads = true instead
; 10

; Allows all headers from reverse-proxy
buffer-size=8192

; Allow sentry
enable-threads = true
threads = 16

; Disable requests logging
disable-logging = false
; logto = /dev/stdout
; logto must NOT be defined for /dev/stdout, that's the default behavior, plus this will produce log rotatint issues
log-level = debug
log-master  = true
; log-master will prevent wsgi from attempting to rotate the log file (system does)


; Disable write exception when NGinx timed out before uwsgi response
; disable-write-exception = true

; Recycle workers
max-requests = 4000

; memory limits
; reload-on-as = 2768
; reload-on-rss = 2192
reload-on-rss = 0 ; no limits
limit-as = 0 ; no limits

no-orphans = true
vacuum = true
reload-mercy = 8

; Conditionnal Harakiri parameter (to handle streaming)
route-run = harakiri:3600
route = /upload/$ harakiri:3600

; route = \.csv$ harakiri:600

; Other timeouts
; Attention, 0 on the following WILL NOT WORK
;http-timeout = 0
;socket-timeout = 0
;read-timeout = 0
;write-timeout = 0

; Further configs to try to debug why responses don't work with files served ...
# protocol = http
# no-buffering = true
# log-verbose = true
# async = 100
harakiri-verbose=true
# lazy-apps = true

; this is necessary to send streams or chunks of data
wsgi-disable-file-wrapper = true

; global timeout
harakiri = 3600
